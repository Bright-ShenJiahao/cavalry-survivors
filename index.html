<script>
'use strict';
const FORCE_DEBUG = false;
const DEBUG = FORCE_DEBUG || new URLSearchParams(location.search).has('debug');

// ===== 可调参数 =====
const P = {
  maxSpeed: 280,     // 最高速度 px/s
  accel: 190,        // 加速度 px/s²
  brake: 550,        // 刹车减速度
  coast: 80,         // 松手滑行减速度
  turnRate: 3.4,     // 静止时的转向速度 rad/s
  turnSpeedFx: 0.72, // 速度对转向的影响：满速时转向速度 = turnRate × (1 - 此值)
  dmgMin: 0.5,       // 0 速伤害倍率
  dmgMax: 2,         // 满速伤害倍率
  charge: 0.7,       // 撞飞阈值（速度比例）
  slashBase: 12,     // 挥砍基础伤害
  ramBase: 25,       // 冲撞基础伤害
  guards: 4,         // 亲卫数量
  cavStart: 60,      // 敌骑出现时间（秒）
  spawnMul: 1,       // 刷怪倍率
  zoom: 0.85,        // 镜头缩放倍率（稍微拉远，屏幕上的移动显得慢一些）
  camLook: 0.12,     // 镜头前瞻：往奔跑方向偏移 = 速度 × 此值（秒）
  camSmooth: 2.5,    // 镜头跟随柔和度：越小越柔
  camDead: 60,       // 镜头死区半径：马在这个范围里动时镜头不动
  grid: false,       // 地面网格线和细碎小点
  vignette: true,    // 高速时屏幕四周变暗
  horse8: true,      // 8 方向马（骑手先用简单图形代替）
  god: false,        // 无敌
  bossTime: 180,     // 最终 Boss 出现时间（秒）
  art: new URLSearchParams(location.search).get('art') || 'retro', // 美术风格：blocks / cartoon / retro / fine
  terrain: true,     // 地形开关
  props: true,       // 地面摆件（栅栏/营帐/草丛/石头…）
  xpNeed: 1,         // 升级所需经验倍率
  slopeK: 900,       // 坡度影响（下坡加速/上坡减速）
  mudMul: 0.5,       // 泥地速度倍率
  view25: true,      // 2.5D 视角
  squash: 0.6,       // 2.5D 地面压扁比例
};
const SLIDERS = [
  ['maxSpeed', '最高速度', 120, 700, 10],
  ['accel', '加速度', 50, 1000, 10],
  ['brake', '刹车力度', 100, 2000, 10],
  ['turnRate', '转向速度', 0.5, 8, 0.1],
  ['turnSpeedFx', '速度对转向的影响', 0, 0.95, 0.01],
  ['dmgMin', '0速伤害倍率', 0.1, 2, 0.05],
  ['dmgMax', '满速伤害倍率', 1, 5, 0.1],
  ['charge', '撞飞速度阈值', 0.3, 1, 0.01],
  ['guards', '亲卫数量', 0, 12, 1],
  ['cavStart', '敌骑出现时间(秒)', 0, 180, 5],
  ['spawnMul', '刷怪倍率', 0, 4, 0.1],
  ['bossTime', 'Boss 出现时间(秒)', 10, 600, 10],
  ['zoom', '镜头缩放', 0.5, 2, 0.05],
  ['camLook', '镜头前瞻', 0, 0.4, 0.01],
  ['camSmooth', '镜头跟随柔和度', 0.5, 10, 0.1],
  ['camDead', '镜头死区', 0, 200, 5],
  ['squash', '2.5D 压扁比例', 0.4, 1, 0.02],
  ['slopeK', '坡度影响', 0, 2000, 50],
  ['mudMul', '泥地速度倍率', 0.2, 1, 0.05],
  ['xpNeed', '升级所需经验倍率', 0.2, 3, 0.1],
];

const WORLD = 4000;
const TAU = Math.PI * 2;
const wrap = a => ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ===== 地形（无限地图）：按区域用确定的随机数生成坡地和泥地 =====
function hsh(i, j, k) { let n = (i * 73856093) ^ (j * 19349663) ^ ((k || 0) * 83492791); n = (n ^ (n >>> 13)) * 1274126177; return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
const SPAWN = { x: 2000, y: 2000 };
const HILL_CELL = 2800, MUD_CELL = 650;   // 高地：少而大；泥地：很少
const FIXED_HILLS = [{ x: 2000, y: 1050, r: 620, h: 260 }];   // 出生点北边一座大高地，方便试下坡冲锋
const hillCache = new Map(), mudCache = new Map();
function hillsIn(i, j) {   // 每个大格子里最多一座坡
  const k = i + ',' + j; let v = hillCache.get(k); if (v) return v;
  v = [];
  const cx = i * HILL_CELL + HILL_CELL / 2, cy = j * HILL_CELL + HILL_CELL / 2;
  if (Math.hypot(cx - SPAWN.x, cy - SPAWN.y) < 2000) { for (const h of FIXED_HILLS) if (Math.floor(h.x / HILL_CELL) === i && Math.floor(h.y / HILL_CELL) === j) v.push(h); }
  else if (hsh(i, j, 1) < 0.35) v.push({ x: cx + (hsh(i, j, 2) - .5) * HILL_CELL * 0.5, y: cy + (hsh(i, j, 3) - .5) * HILL_CELL * 0.5, r: 480 + hsh(i, j, 4) * 300, h: 180 + hsh(i, j, 5) * 120 });
  hillCache.set(k, v); return v;
}
function mudsIn(i, j) {    // 每个小格子里可能有一片泥地（几团圆拼成）
  const k = i + ',' + j; let v = mudCache.get(k); if (v) return v;
  v = [];
  const cx = i * MUD_CELL + MUD_CELL / 2, cy = j * MUD_CELL + MUD_CELL / 2;
  const fixed = i === 3 && j === 4;
  if (fixed || (Math.hypot(cx - SPAWN.x, cy - SPAWN.y) > 900 && hsh(i, j, 7) < 0.04)) {
    const mx = cx + (hsh(i, j, 8) - .5) * MUD_CELL * 0.5, my = cy + (hsh(i, j, 9) - .5) * MUD_CELL * 0.5, mr = 70 + hsh(i, j, 10) * 110;
    const n = 3 + Math.floor(hsh(i, j, 11) * 4);
    for (let q = 0; q < n; q++) { const a = hsh(i, j, 20 + q) * TAU, d = hsh(i, j, 40 + q) * mr * 0.7; v.push({ x: mx + Math.cos(a) * d, y: my + Math.sin(a) * d * 0.8, r: mr * (0.45 + hsh(i, j, 60 + q) * 0.45) }); }
  }
  mudCache.set(k, v); return v;
}
function mudAt(x, y) {
  if (!P.terrain) return false;
  if (P.props && typeof pondAt === 'function' && pondAt(x, y)) return true;
  const i = Math.floor(x / MUD_CELL), j = Math.floor(y / MUD_CELL);
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) for (const m of mudsIn(i + a, j + b)) { const dx = x - m.x, dy = y - m.y; if (dx * dx + dy * dy < m.r * m.r * 0.7) return true; }
  return false;
}
function gradAt(x, y) {
  let gx = 0, gy = 0;
  if (!P.terrain) return [0, 0];
  const i = Math.floor(x / HILL_CELL), j = Math.floor(y / HILL_CELL);
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) for (const h of hillsIn(i + a, j + b)) {
    const dx = x - h.x, dy = y - h.y, r2 = h.r * h.r, d2 = dx * dx + dy * dy;
    if (d2 > r2 * 9) continue;
    const e = h.h * Math.exp(-d2 / r2) * -2 / r2;
    gx += e * dx; gy += e * dy;
  }
  return [gx, gy];
}

// ===== 地面摆件（无限地图，按格子确定性生成） =====
const PROP_CELL = 600, POND_CELL = 1800, propCache = new Map(), pondCache = new Map();
// 碰撞圈 [dx,dy,r]；brk=可撞碎（loss=撞碎后掉速比例）；tall=挡视线时半透明
const PDEF = {
  fence: { cs: [[-22, 0, 10], [0, 0, 10], [22, 0, 10]], brk: .10, col: '#7a5530' },
  fenceC: { cs: [[-20, 0, 10], [0, 0, 10], [15, -12, 10]], brk: .10, col: '#7a5530' },
  tentW: { cs: [[0, -10, 55]], brk: .25, tall: 1, col: '#d8c8a0' },
  tentR: { cs: [[0, -10, 68]], brk: .25, tall: 1, col: '#b84a36' },
  flag: { cs: [[0, 0, 12]], brk: .10, col: '#c03028' },
  fire: { cs: [[0, 0, 22]], brk: 0, col: '#ff9a30' },
  tam1: { cs: [[0, -6, 32]], tall: 1 }, tam2: { cs: [[0, -6, 38]], tall: 1 },
  rockM: { cs: [[0, -4, 22]] },
  bushS: {}, bushM: {}, wreck: {},
};
const FLAT = new Set(['tuft1', 'tuft2', 'tuft3', 'tuft4', 'rubble', 'flat', 'dec1', 'dec2', 'dec3', 'pond1', 'pond2']);
const PSCALE = { fence: 0.5, fenceC: 0.5, wreck: 0.5, dec1: 0.55, dec2: 0.5, dec3: 0.52 };   // 残骸/贴花缩到和人物差不多大
const mkProp = (id, k, x, y) => ({ prop: 1, id, k, x, y, flat: FLAT.has(k), d: PDEF[k] || {} });
const nearSpawn = (x, y, r) => Math.hypot(x - SPAWN.x, y - SPAWN.y) < r;
// 出生点小营地（暂时停用，gatherProps 里不收集）
const CAMP = [
  ['tentR', 2450, 2330], ['tentW', 2310, 2390], ['tentW', 2590, 2400], ['flag', 2380, 2250], ['fire', 2470, 2440],
  ['fence', 2290, 2190], ['fence', 2610, 2190], ['fence', 2300, 2520], ['fenceC', 2600, 2525],
].map((a, n) => mkProp('camp' + n, a[0], a[1], a[2]));
function propsIn(i, j) {
  const key = i + ',' + j; let v = propCache.get(key); if (v) return v;
  v = [];
  const x0 = i * PROP_CELL, y0 = j * PROP_CELL, R = (k) => hsh(i, j, 100 + k);
  const add = (k, x, y, n) => { if (!nearSpawn(x, y, 320) && !mudAt(x, y)) v.push(mkProp(key + ':' + n, k, x, y)); };
  const nt = Math.floor(R(0) * 4);   // 草丛 0~3
  for (let q = 0; q < nt; q++) add('tuft' + (1 + Math.floor(R(10 + q) * 4)), x0 + R(20 + q) * PROP_CELL, y0 + R(30 + q) * PROP_CELL, 't' + q);
  if (R(1) < 0.22) add(R(2) < 0.6 ? 'bushS' : 'bushM', x0 + R(3) * PROP_CELL, y0 + R(4) * PROP_CELL, 'b');
  if (R(5) < 0.10) { const t = Math.floor(R(6) * 4); add(['wreck', 'dec1', 'dec2', 'dec3'][t], x0 + 100 + R(7) * 400, y0 + 100 + R(8) * 400, 'w'); }
  if (R(9) < 0.06) {   // 野外木栅栏：一小段
    const n = 2 + Math.floor(R(40) * 3), fx = x0 + 80 + R(41) * 260, fy = y0 + 100 + R(42) * 400;
    for (let q = 0; q < n; q++) add(q === n - 1 && R(43) < 0.4 ? 'fenceC' : 'fence', fx + q * 46, fy, 'f' + q);
  }
  propCache.set(key, v); return v;
}
function pondsIn(i, j) {   // 水塘：很少，减速；边上长柽柳（挡路）
  const key = i + ',' + j; let v = pondCache.get(key); if (v) return v;
  v = [];
  const cx = i * POND_CELL + POND_CELL / 2 + (hsh(i, j, 201) - .5) * 900, cy = j * POND_CELL + POND_CELL / 2 + (hsh(i, j, 202) - .5) * 900;
  if (hsh(i, j, 200) < 0.12 && !nearSpawn(cx, cy, 900)) {
    const big = hsh(i, j, 203) < 0.5, p = mkProp('p' + key, big ? 'pond2' : 'pond1', cx, cy);
    p.pr = big ? 140 : 100; v.push(p);
    const nt = 1 + Math.floor(hsh(i, j, 204) * 2);
    for (let q = 0; q < nt; q++) { const a = hsh(i, j, 210 + q) * TAU, d = p.pr + 50; v.push(mkProp('p' + key + 't' + q, hsh(i, j, 220 + q) < 0.5 ? 'tam1' : 'tam2', cx + Math.cos(a) * d, cy + Math.sin(a) * d * 0.8)); }
  }
  pondCache.set(key, v); return v;
}
function hillProps(h) {   // 坡顶碎石（不挡路），坡边 1~2 块大石头（挡路）
  if (h.props) return h.props;
  const s = Math.floor(h.x * 7 + h.y * 13), R = (k) => hsh(s, 77, k), v = [];
  const n = 3 + Math.floor(R(0) * 2);
  for (let q = 0; q < n; q++) { const a = R(1 + q) * TAU, d = h.r * (0.2 + R(10 + q) * 0.15); v.push(mkProp('h' + s + 'r' + q, R(20 + q) < 0.5 ? 'rubble' : 'flat', h.x + Math.cos(a) * d, h.y + Math.sin(a) * d)); }
  const nr = 1 + Math.floor(R(30) * 2);

function steer(o, dx, dy, m, dt, q) {
  const mud = mudAt(o.x, o.y), acc = q.accel * (mud ? P.mudMul : 1);

    const d = wrap(Math.atan2(dy, dx) - o.a);

  o.y += Math.sin(o.a) * o.v * dt;

}

    S.cavT -= dt;

  for (const e of S.en) {

    if (e.type === 'pha') {

      const dx = sx - e.x, dy = sy - e.y, d = Math.hypot(dx, dy);
      if (d > 2) { const sp = Math.min(d / dt, 160); e.x += dx / d * sp * dt; e.y += dy / d * sp * dt; e.wk = (e.wk || 0) + dt * sp * 0.11; }

    } else if (e.type === 'dar') {

    } else if (e.type === 'cav') {

      // 会绕开摆件；实在绕不开（锁定冲锋中）才撞过去
      const av = propAvoid(e.x, e.y, Math.cos(e.a), Math.sin(e.a), 60 + e.v * 0.4, e.r);
      if (runStun(e)) { steer(e, 0, 0, 0, dt, qc); e.v *= 0.9; }

      }

      if (e.v > P.maxSpeed * 0.45 && Math.random() < 0.3) S.dust.push({ x: e.x - Math.cos(e.a) * 18, y: e.y - Math.sin(e.a) * 18, t: 0.45, r: rand(3, 5) });
    } else {
      let dx = tg.x - e.x, dy = tg.y - e.y, d = td || 1;
      const esp = e.sp * (mudAt(e.x, e.y) ? 0.6 : 1) * runSlow(e);   // 倒地 / 被套 / 踩蒺藜
      let mx = dx / d * esp, my = dy / d * esp;
      const cx = (e.x / CELL) | 0, cy = (e.y / CELL) | 0;
      for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
        const a = grid.get((cx + i) * 1000 + cy + j); if (!a) continue;
        for (const o of a) {

      }

          if (r >= P.charge) {

            rd.v *= 0.99;

            if (r > 0.4) addNum(rd.x, rd.y - 20, '挡住!', '#7cf', false);
            rd.v *= 0.45; e.cd = 0.5;
          }
          rd.x -= nx * (rr - d); rd.y -= ny * (rr - d);
        } else if (e.type === 'dar') {
          if (e.cd <= 0) { hit(e, P.ramBase * m * 1.2, nx, ny, 0); rd.v *= 0.85; e.cd = 0.4; }
          const p = (rr - d) / 2;
          e.x += nx * p; e.y += ny * p; rd.x -= nx * p; rd.y -= ny * p;
        } else if (e.type === 'brute') {
          if (e.cd <= 0) {
            hit(e, P.ramBase * m, nx, ny, 300);
            if (r > 0.3) addNum(rd.x, rd.y - 20, '掉速!', '#7cf', false);
            rd.v *= 0.3; e.cd = 0.6;
          }
          rd.x -= nx * (rr - d); rd.y -= ny * (rr - d);
        } else {
          // 骑兵对撞：比谁朝对方冲得更猛（侧面撞占便宜）
          if (e.cd <= 0) {
            const pR = rd.v * Math.max(0.2, fx * nx + fy * ny);
            const pE = e.v * Math.max(0.2, -(Math.cos(e.a) * nx + Math.sin(e.a) * ny));
            if (pR >= pE) {
              hit(e, P.ramBase * m * 1.5, nx, ny, 220 + rd.v);
              rd.v *= 0.85; e.v *= 0.3;
            } else {
              hurtRider(rd, (e.type === 'char' ? 25 : 10) + (e.type === 'char' ? 35 : 25) * pE / P.maxSpeed, true);
              rd.v *= 0.35; e.v *= 0.7;
              rd.x += Math.cos(e.a) * 14; rd.y += Math.sin(e.a) * 14;
              if (rd.leader && r > 0.2) addNum(rd.x, rd.y - 30, '被撞!', '#ff5050', true);
            }
            e.cd = 0.6;
          }
          const p = (rr - d) / 2;
          e.x += nx * p; e.y += ny * p; rd.x -= nx * p; rd.y -= ny * p;
        }
      }
      // 步兵贴身伤害
      if (!e.dead && e.type !== 'cav' && e.type !== 'char' && e.type !== 'dar' && !runNoAtk(e)) hurtRider(rd, (e.type === 'brute' ? 20 : e.type === 'pha' ? 8 : 5) * dt, false);
    }
  }
  S.en = S.en.filter(e => !e.gone && (!e.dead || e.fly > 0));
  // 亲卫阵亡
  S.g = S.g.filter(g => {
    if (g.hp > 0) return true;
    addNum(g.x, g.y - 20, '阵亡', '#ff8080', true);
    return false;

  if (L.hp <= 0) { L.hp = 0; S.dead = true; }
}

// ===== 自动挥砍 =====
const SLASH_R = 75, GSLASH_R = 45;
function slash(rd, R, base, dt) {

  rd.slashT -= dt;

// ===== 绘制 =====
function hash(x, y) { let n = x * 374761393 + y * 668265263; n = (n ^ (n >> 13)) * 1274126177; return ((n ^ (n >> 16)) >>> 0) / 4294967296; }

// ===== 地面：贴图分块渲染（无限地图），每块缓存成一张画布 =====
const GT = {};
for (const k of ['grass', 'dirt', 'trod', 'mud']) { const im = new Image(); im.src = `assets/ground/${k}.jpg`; GT[k] = im; }
const TILE_W = 420;            // 一张贴图在世界里的边长
const CHUNK = 512, CHUNK_PX = 512;
const chunks = new Map();
let chunkBudget = 0;
function gpat(c, k) {           // 贴图图案，锚定在世界原点，跨块连续
  const im = GT[k]; if (!ready(im)) return null;
  const p = c.createPattern(im, 'repeat'); const sc = TILE_W / im.naturalWidth;
  p.setTransform(new DOMMatrix([sc, 0, 0, sc, 0, 0])); return p;
}
// 在块画布上画一团柔边的地面（用另一张贴图）
function blob(c, x0, y0, k, x, y, r, alpha, core) {
  const p = gpat(c, k); if (!p) return;
  const t = blob.t || (blob.t = document.createElement('canvas')), tc = t.getContext('2d');
  const S2 = Math.ceil(r * 2) + 4; if (t.width < S2) { t.width = t.height = S2; }
  tc.setTransform(1, 0, 0, 1, 0, 0); tc.globalCompositeOperation = 'source-over'; tc.clearRect(0, 0, S2, S2);
  tc.save(); tc.translate(-(x - r), -(y - r)); tc.fillStyle = p; tc.fillRect(x - r, y - r, S2, S2); tc.restore();
  tc.globalCompositeOperation = 'destination-in';

  g.addColorStop(0, `rgba(0,0,0,${alpha})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  tc.fillStyle = g; tc.fillRect(0, 0, S2, S2);
  c.drawImage(t, 0, 0, S2, S2, x - r - x0, y - r - y0, S2, S2);
}
function buildChunk(ci, cj) {
  const cv2 = document.createElement('canvas'); cv2.width = cv2.height = CHUNK_PX;
  const c = cv2.getContext('2d'), x0 = ci * CHUNK, y0 = cj * CHUNK;
  const pg = gpat(c, 'grass'); c.save(); c.translate(-x0, -y0); c.fillStyle = pg; c.fillRect(x0, y0, CHUNK, CHUNK); c.restore();
  // 大块黄土和踩踏地：按 700 的格子撒，跨块也连续
  const BC = 700;
  for (let i = Math.floor((x0 - 500) / BC); i <= Math.floor((x0 + CHUNK + 500) / BC); i++)
    for (let j = Math.floor((y0 - 500) / BC); j <= Math.floor((y0 + CHUNK + 500) / BC); j++) {
      const n = Math.floor(hsh(i, j, 101) * 3);
      for (let q = 0; q < n; q++) {
        const x = i * BC + hsh(i, j, 110 + q) * BC, y = j * BC + hsh(i, j, 120 + q) * BC, r = 140 + hsh(i, j, 130 + q) * 300;
        if (x + r < x0 || x - r > x0 + CHUNK || y + r < y0 || y - r > y0 + CHUNK) continue;
        blob(c, x0, y0, hsh(i, j, 140 + q) < 0.45 ? 'dirt' : 'trod', x, y, r, 0.9, 0.35);
      }
    }
  // 泥地（和减速判定用同一组圆）
  if (P.terrain) for (let i = Math.floor((x0 - 300) / MUD_CELL); i <= Math.floor((x0 + CHUNK + 300) / MUD_CELL); i++)
    for (let j = Math.floor((y0 - 300) / MUD_CELL); j <= Math.floor((y0 + CHUNK + 300) / MUD_CELL); j++)
      for (const m of mudsIn(i, j)) { if (m.x + m.r * 1.3 < x0 || m.x - m.r * 1.3 > x0 + CHUNK || m.y + m.r * 1.3 < y0 || m.y - m.r * 1.3 > y0 + CHUNK) continue; blob(c, x0, y0, 'mud', m.x, m.y, m.r * 1.25, 1, 0.6); }
  // 坡地：迎光面亮、背光面暗
  if (P.terrain) for (let i = Math.floor(x0 / HILL_CELL) - 1; i <= Math.floor((x0 + CHUNK) / HILL_CELL) + 1; i++)
    for (let j = Math.floor(y0 / HILL_CELL) - 1; j <= Math.floor((y0 + CHUNK) / HILL_CELL) + 1; j++)
      for (const h of hillsIn(i, j)) {
        const R = h.r * 1.8; if (h.x + R < x0 || h.x - R > x0 + CHUNK || h.y + R < y0 || h.y - R > y0 + CHUNK) continue;
        c.save(); c.translate(-x0, -y0);
        let g = c.createRadialGradient(h.x + h.r * 0.35, h.y + h.r * 0.35, 0, h.x + h.r * 0.35, h.y + h.r * 0.35, R);
        g.addColorStop(0, `rgba(40,30,10,${0.18 + h.h / 700})`); g.addColorStop(1, 'rgba(40,30,10,0)');
        c.fillStyle = g; c.beginPath(); c.arc(h.x + h.r * 0.35, h.y + h.r * 0.35, R, 0, TAU); c.fill();
        g = c.createRadialGradient(h.x - h.r * 0.25, h.y - h.r * 0.25, 0, h.x - h.r * 0.25, h.y - h.r * 0.25, h.r * 1.3);
        g.addColorStop(0, `rgba(255,240,190,${0.14 + h.h / 700})`); g.addColorStop(1, 'rgba(255,240,190,0)');
        c.fillStyle = g; c.beginPath(); c.arc(h.x - h.r * 0.25, h.y - h.r * 0.25, h.r * 1.3, 0, TAU); c.fill();
        c.restore();
      }
  return cv2;
}
function drawGround(zx, zy) {
  const vw = W / zx, vh = H / zy, x0 = S.cam.x - vw / 2, y0 = S.cam.y - vh / 2;
  ctx.fillStyle = '#8a7444'; ctx.fillRect(x0, y0, vw, vh);
  if (!ready(GT.grass)) return;
  chunkBudget = 3;   // 每帧最多新生成 3 块，避免卡顿
  const key0 = P.terrain ? 't' : 'f';
  for (let ci = Math.floor(x0 / CHUNK); ci <= Math.floor((x0 + vw) / CHUNK); ci++)
    for (let cj = Math.floor(y0 / CHUNK); cj <= Math.floor((y0 + vh) / CHUNK); cj++) {
      const k = key0 + ci + ',' + cj; let ch = chunks.get(k);
      if (!ch && chunkBudget > 0 && ready(GT.dirt) && ready(GT.trod) && ready(GT.mud)) { chunkBudget--; ch = buildChunk(ci, cj); chunks.set(k, ch); if (chunks.size > 80) chunks.delete(chunks.keys().next().value); }
      if (ch) ctx.drawImage(ch, ci * CHUNK, cj * CHUNK, CHUNK + 0.5, CHUNK + 0.5);
      else { ctx.save(); ctx.fillStyle = gpat(ctx, 'grass'); ctx.fillRect(ci * CHUNK, cj * CHUNK, CHUNK, CHUNK); ctx.restore(); }
    }

    const G = 160;
    for (let x = Math.floor(x0 / G) * G; x <= x0 + vw; x += G) { ctx.moveTo(x, y0); ctx.lineTo(x, y0 + vh); }
    for (let y = Math.floor(y0 / G) * G; y <= y0 + vh; y += G) { ctx.moveTo(x0, y); ctx.lineTo(x0 + vw, y); }
    ctx.stroke();
  }
  if (S.boss && S.boss.gap > 60) {
    const B = S.boss, a = clamp((B.gap - 60) / 120, 0, 1) * (0.35 + 0.2 * Math.sin(S.t * 8));
    ctx.fillStyle = `rgba(255,215,80,${a})`;
    ctx.fillRect(B.cx + B.offL - PHA_SP / 2, Math.min(B.cy, B.cy - B.side * 24) - 30, B.gap + PHA_SP, 84);
  }
}

// 画一名骑手。st: {horse, rider, ring, s(缩放)}
function drawRider(o, st, charging) {

const ST_LEADER = { horse: '#e8e2d6', rider: '#f5f5f5', ring: '#2a5db0', s: 1 };

let last = performance.now();
function frame(now) {

  const kl = 1 - Math.exp(-1.5 * dt);

  S.look.y += (Math.sin(h.a) * h.v * P.camLook - S.look.y) * kl;
  if (S.demo) { S.cam.x = WORLD / 2; S.cam.y = WORLD / 2; }   // 主界面：镜头固定

    const ox = h.x + S.look.x + yo[0] - S.cam.x, oy = h.y + S.look.y + yo[1] - S.cam.y, od = Math.hypot(ox, oy);

    }
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const fdt = S.dead || S.won || S.paused ? 0 : dt;
  if (P.view25) {
    SQ = P.squash;
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z * SQ); ctx.translate(-S.cam.x, -S.cam.y);
    drawGround(z, z * SQ); ctx.restore();

    ctx.restore();
  } else {

  document.body.append(el);
  const step = s => el.querySelectorAll('.pp-step').forEach(x => x.hidden = x.dataset.s !== s);
  const tab = t => {
    el.querySelectorAll('.pp-tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === t));
    el.querySelectorAll('.pp-pane').forEach(p => p.hidden = p.dataset.t !== t);
    const yard = t === 'stable';
    el.classList.toggle('yard', yard);
    if (yard && !S.yard) enterYard(); else if (!yard && S.yard) { S.yard = false; demoScene(); }
  };
  el.querySelectorAll('.pp-tabs button').forEach(b => b.onclick = () => tab(b.dataset.t));
  // 马厩滑块
  const sl = el.querySelector('#tmp'), out = el.querySelector('#tmpStats');
  const pct = v => { const n = Math.round(v * 100); return `<b class="${n === 0 ? '' : n > 0 ? 'up' : 'dn'}">${n > 0 ? '+' : ''}${n}%</b>`; };
  const show = () => { const t = TMP(); out.innerHTML = `<span>最高速度 ${pct(t.spd - 1)}</span><span>加速 ${pct(t.acc - 1)}</span><span>转向 ${pct(t.turn - 1)}</span><span>刹车 ${pct(t.brake - 1)}</span>`; };
  const set = v => { for (const k of [-100, 0, 100]) if (Math.abs(v - k) < 6) v = k; TEMPER = v / 100; sl.value = v; show(); try { localStorage.setItem('cs_temper', TEMPER); } catch (e) {} };
  sl.addEventListener('input', () => set(+sl.value));
  el.querySelectorAll('.ticks span').forEach(s => s.onclick = () => set(+s.dataset.v));
  // 流程
  const open = () => { sl.value = Math.round(TEMPER * 100); show(); step('prep'); tab('gear'); el.hidden = false; bar.hidden = false; mm.hidden = true; };
  const home = () => { el.hidden = true; bar.hidden = true; S.yard = false; openMenu(); };
  const go = () => { el.hidden = true; bar.hidden = true; el.classList.remove('yard'); S.yard = false; reset(false); };
  el.querySelector('[data-s=prep] .pp-back').onclick = home;
  el.querySelector('.pp-next').onclick = () => { if (S.yard) { S.yard = false; demoScene(); } el.classList.remove('yard'); step('stage'); };
  el.querySelector('[data-s=stage] .pp-back').onclick = () => { step('prep'); tab('gear'); };
  el.querySelector('.pp-go').onclick = go;
  addEventListener('keydown', e => { if (!el.hidden && e.code === 'Escape') [...el.querySelectorAll('.pp-back')].find(b => b.offsetParent)?.click(); });
  // 首页：名字必填，口令可选
  const nm = document.getElementById('mm-name'), pin = document.getElementById('mm-pin'), startBtn = document.getElementById('mm-start');
  try { pin.value = localStorage.getItem('cs_pin') || ''; } catch (e) {}
  pin.addEventListener('input', () => { try { localStorage.setItem('cs_pin', pin.value); } catch (e) {} });
  const sync = () => startBtn.classList.toggle('off', !nm.value.trim());
  nm.addEventListener('input', () => { nm.classList.remove('need'); sync(); }); setTimeout(sync, 0);
  startBtn.onclick = () => { if (!nm.value.trim()) { nm.classList.add('need'); nm.focus(); return; } open(); };
})();
try { const nm = localStorage.getItem('cs_name'); if (nm) document.getElementById('mm-name').value = nm; } catch (e) {}
document.getElementById('mm-name').addEventListener('input', ev => { try { localStorage.setItem('cs_name', ev.target.value); } catch (e) {} });
(function heroCard() {   // 角色卡里的主角奔跑动画
  const c = document.getElementById('mm-hero'), x = c.getContext('2d');
  let t = 0;
  (function loop() {
    t += 1 / 60;
    const A = ARTS[P.art] || ARTS.retro, im = A.hero[Math.floor(t * 10) % 6];
    x.clearRect(0, 0, c.width, c.height);
    x.fillStyle = 'rgba(0,0,0,.3)'; x.beginPath(); x.ellipse(200, 262, 120, 16, 0, 0, TAU); x.fill();
    if (ready(im)) { const h = 210, w = im.naturalWidth * h / im.naturalHeight; x.drawImage(im, 200 - w / 2, 262 - h + Math.abs(Math.sin(t * 10)) * 4, w, h); }
    if (!mm.hidden) requestAnimationFrame(loop); else setTimeout(() => requestAnimationFrame(loop), 300);
  })();
})();
if (MENU) openMenu();

// ===== 加载界面：等精灵图都加载完再淡出 =====
(function loading() {
  const el = document.getElementById('loading'), fill = document.getElementById('ld-fill'), tip = document.getElementById('ld-tip');
  const bg = new Image();
  bg.onload = () => { for (const c of el.querySelectorAll('.ld-bg,.ld-img')) c.style.backgroundImage = `url(${bg.src})`; };
  bg.src = Math.min(innerWidth, innerHeight) * (window.devicePixelRatio || 1) > 900 ? 'assets/loading.jpg' : 'assets/loading_s.jpg';
  const all = [...Object.values(ARTS).flatMap(a => [...a.hero, a.guard, a.inf, a.shield, a.cav]), ...Object.values(PROP_IMG)];
  const t0 = performance.now();
  (function tick() {
    const done = all.filter(im => im.complete).length, p = done / all.length;
    fill.style.width = Math.round(p * 100) + '%';
    if (p >= 1 && performance.now() - t0 > 1500) {
      tip.textContent = '穿越完成！';
      setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 700); }, 300);
    } else requestAnimationFrame(tick);
  })();
})();

  }

  bd.appendChild(tr);
  const g = document.createElement('label');

  g.querySelector('input').addEventListener('change', ev => { P.god = ev.target.checked; });
  bd.appendChild(g);
  const b = document.createElement('button'); b.textContent = '重新开始'; b.onclick = reset; bd.appendChild(b);
  const bb = document.createElement('button'); bb.textContent = '立即召唤 Boss'; bb.onclick = () => startBoss(); bd.appendChild(bb);
  const bl = document.createElement('button'); bl.textContent = '升 1 级'; bl.onclick = () => { S.run.queue++; S.run.lastLv = -9; }; bd.appendChild(bl);
  const bc = document.createElement('button'); bc.textContent = '开宝箱'; bc.onclick = () => openChest(); bd.appendChild(bc);
  const c = document.createElement('button'); c.textContent = '复制当前参数';
  c.onclick = () => {
    const t = JSON.stringify(P);
    const done = () => c.textContent = '已复制';
    const fail = () => { c.textContent = '复制失败，见下方'; let ta = bd.querySelector('textarea'); if (!ta) { ta = document.createElement('textarea'); ta.style.width = '100%'; bd.appendChild(ta); } ta.value = t; ta.select(); };
    try { navigator.clipboard.writeText(t).then(done, fail); } catch (e) { fail(); }
  };
  bd.appendChild(c);
  let open = innerWidth > 1000;
  const setOpen = () => { bd.style.display = open ? 'block' : 'none'; document.getElementById('dbgArrow').textContent = open ? '▲' : '▼'; };
  document.getElementById('dbgHd').onclick = () => { open = !open; setOpen(); };
  setOpen();
}
