<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>骑兵幸存者 · 原型</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1a1a1a;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
#dbg{position:fixed;top:6px;right:6px;z-index:2;background:rgba(0,0,0,.62);color:#fff;font-size:12px;border-radius:6px;width:220px;display:none;max-height:calc(100vh - 12px);overflow:auto}
#dbg .hd{padding:6px 8px;font-weight:bold;cursor:pointer;display:flex;justify-content:space-between}
#dbg .bd{padding:0 8px 8px}
#dbg label{display:block;margin:4px 0}
#dbg .t{display:flex;justify-content:space-between}
#dbg input[type=range]{width:100%;margin:2px 0}
#dbg button{margin-top:4px;width:100%;padding:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dbg"><div class="hd" id="dbgHd"><span>调试面板</span><span id="dbgArrow">▲</span></div><div class="bd" id="dbgBd"></div></div>
<script>
'use strict';
const FORCE_DEBUG = false;
const DEBUG = FORCE_DEBUG || new URLSearchParams(location.search).has('debug');

// ===== 可调参数 =====
const P = {
  maxSpeed: 280,     // 最高速度 px/s
  accel: 190,        // 加速度 px/s²
  brake: 550,        // 刹车减速度
  coast: 80,         // 松手滑行减速度
  turnRate: 3.4,     // 静止时的转向速度 rad/s
  turnSpeedFx: 0.72, // 速度对转向的影响：满速时转向速度 = turnRate × (1 - 此值)
  dmgMin: 0.5,       // 0 速伤害倍率
  dmgMax: 2,         // 满速伤害倍率
  charge: 0.7,       // 撞飞阈值（速度比例）
  slashBase: 12,     // 挥砍基础伤害
  ramBase: 25,       // 冲撞基础伤害
  guards: 4,         // 亲卫数量
  cavStart: 60,      // 敌骑出现时间（秒）
  spawnMul: 1,       // 刷怪倍率
  zoom: 1,           // 镜头缩放倍率
  god: false,        // 无敌
  terrain: true,     // 地形开关
  slopeK: 900,       // 坡度影响（下坡加速/上坡减速）
  mudMul: 0.5,       // 泥地速度倍率
  view25: true,      // 2.5D 视角
  squash: 0.6,       // 2.5D 地面压扁比例
};
const SLIDERS = [
  ['maxSpeed', '最高速度', 120, 700, 10],
  ['accel', '加速度', 50, 1000, 10],
  ['brake', '刹车力度', 100, 2000, 10],
  ['turnRate', '转向速度', 0.5, 8, 0.1],
  ['turnSpeedFx', '速度对转向的影响', 0, 0.95, 0.01],
  ['dmgMin', '0速伤害倍率', 0.1, 2, 0.05],
  ['dmgMax', '满速伤害倍率', 1, 5, 0.1],
  ['charge', '撞飞速度阈值', 0.3, 1, 0.01],
  ['guards', '亲卫数量', 0, 12, 1],
  ['cavStart', '敌骑出现时间(秒)', 0, 180, 5],
  ['spawnMul', '刷怪倍率', 0, 4, 0.1],
  ['zoom', '镜头缩放', 0.5, 2, 0.05],
  ['squash', '2.5D 压扁比例', 0.4, 1, 0.02],
  ['slopeK', '坡度影响', 0, 2000, 50],
  ['mudMul', '泥地速度倍率', 0.2, 1, 0.05],
];

const WORLD = 4000;
const TAU = Math.PI * 2;
const wrap = a => ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ===== 地形：坡地 + 泥地 =====
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const HILLS = [], MUDS = [];
(() => {
  const R = mulberry(7), C = 2000;
  // 出生点附近的固定测试地形：北边大坡、东西两个小坡，南边两片泥地
  HILLS.push({ x: C, y: C - 800, r: 420, h: 170 }, { x: C + 700, y: C - 100, r: 260, h: 100 }, { x: C - 750, y: C + 150, r: 300, h: 120 });
  MUDS.push({ x: C - 150, y: C + 520, r: 150 }, { x: C + 450, y: C + 650, r: 120 });
  for (let i = 0; i < 26; i++) {
    const x = 300 + R() * 3400, y = 300 + R() * 3400;
    if (Math.hypot(x - C, y - C) < 900) continue;
    HILLS.push({ x, y, r: 200 + R() * 300, h: 60 + R() * 140 });
  }
  for (let i = 0; i < 34; i++) {
    const x = 200 + R() * 3600, y = 200 + R() * 3600;
    if (Math.hypot(x - C, y - C) < 350) continue;
    MUDS.push({ x, y, r: 60 + R() * 120 });
  }
  // 每片泥地由几团圆拼成不规则形状
  for (const m of MUDS) { m.blobs = []; const n = 4 + Math.floor(R() * 4); for (let k = 0; k < n; k++) { const a = R() * TAU, d = R() * m.r * 0.7; m.blobs.push({ x: m.x + Math.cos(a) * d, y: m.y + Math.sin(a) * d * 0.8, r: m.r * (0.45 + R() * 0.45) }); } }
})();
const MG = 40, MN = 100, mudGrid = new Uint8Array(MN * MN);
for (const m of MUDS) for (const b of m.blobs)
  for (let i = Math.floor((b.x - b.r) / MG); i <= Math.floor((b.x + b.r) / MG); i++)
    for (let j = Math.floor((b.y - b.r) / MG); j <= Math.floor((b.y + b.r) / MG); j++)
      if (i >= 0 && j >= 0 && i < MN && j < MN && Math.hypot(i * MG + MG / 2 - b.x, j * MG + MG / 2 - b.y) < b.r) mudGrid[i * MN + j] = 1;
function mudAt(x, y) {
  if (!P.terrain) return false;
  const i = (x / MG) | 0, j = (y / MG) | 0;
  return i >= 0 && j >= 0 && i < MN && j < MN && mudGrid[i * MN + j] === 1;
}
function gradAt(x, y) {
  let gx = 0, gy = 0;
  if (!P.terrain) return [0, 0];
  for (const h of HILLS) {
    const dx = x - h.x, dy = y - h.y, r2 = h.r * h.r, d2 = dx * dx + dy * dy;
    if (d2 > r2 * 9) continue;
    const e = h.h * Math.exp(-d2 / r2) * -2 / r2;
    gx += e * dx; gy += e * dy;
  }
  return [gx, gy];
}

// ===== 画布 =====
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
}
addEventListener('resize', resize); resize();
const baseZoom = () => Math.max(0.5, Math.min(1.2, Math.min(W, H) / 650)) * P.zoom;

// ===== 状态 =====
let S;
function makeGuard(i, L) {
  const row = Math.floor(i / 2) + 1, side = i % 2 ? 1 : -1;
  const ox = -36 * row, oy = side * 28 * row;
  const ca = Math.cos(L.a), sa = Math.sin(L.a);
  return { x: L.x + ca * ox - sa * oy, y: L.y + sa * ox + ca * oy, a: L.a, v: L.v, ox, oy, phase: rand(0, 6), hp: 60, max: 60, slashT: rand(0, 0.5), slashAnim: 0, flash: 0 };
}
function setGuards(n) {
  S.g = S.g.slice(0, n);
  for (let i = S.g.length; i < n; i++) S.g.push(makeGuard(i, S.h));
  S.g.forEach((g, i) => { const m = makeGuard(i, S.h); g.ox = m.ox; g.oy = m.oy; });
}
function reset() {
  S = {
    t: 0, kills: 0, dead: false,
    h: { x: WORLD / 2, y: WORLD / 2, a: -Math.PI / 2, v: 0, hp: 100, max: 100, slashT: 0, slashAnim: 0, flash: 0, leader: true },
    g: [], en: [], nums: [], dust: [],
    spawnAcc: 0, bruteT: 15, cavT: 0, cam: { x: WORLD / 2, y: WORLD / 2 },
  };
  setGuards(P.guards);
}
reset();

// ===== 输入 =====
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (S.dead && (e.code === 'Space' || e.code === 'Enter')) reset(); });
addEventListener('keyup', e => { keys[e.code] = false; });
const joy = { on: false, id: null, bx: 0, by: 0, x: 0, y: 0, R: 60 };
cv.addEventListener('pointerdown', e => {
  if (S.dead) { reset(); return; }
  joy.on = true; joy.id = e.pointerId; joy.bx = joy.x = e.clientX; joy.by = joy.y = e.clientY;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => { if (joy.on && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });
const joyEnd = e => { if (e.pointerId === joy.id) { joy.on = false; joy.id = null; } };
cv.addEventListener('pointerup', joyEnd); cv.addEventListener('pointercancel', joyEnd);

function getInput() {
  const r = rawInput();
  if (r.m > 0 && P.view25) { const x = r.x, y = r.y / P.squash, n = Math.hypot(x, y); r.x = x / n; r.y = y / n; }
  return r;
}
function rawInput() {
  let x = 0, y = 0;
  if (keys.KeyA || keys.ArrowLeft) x--;
  if (keys.KeyD || keys.ArrowRight) x++;
  if (keys.KeyW || keys.ArrowUp) y--;
  if (keys.KeyS || keys.ArrowDown) y++;
  const m = Math.hypot(x, y);
  if (m > 0) return { x: x / m, y: y / m, m: 1 };
  if (joy.on) {
    const dx = joy.x - joy.bx, dy = joy.y - joy.by, d = Math.hypot(dx, dy);
    if (d < 8) return { m: 0 };
    return { x: dx / d, y: dy / d, m: Math.min(1, d / joy.R) };
  }
  return { m: 0 };
}

// ===== 骑乘物理（主角、亲卫、敌骑共用） =====
const ratio = o => Math.min(1.3, o.v / P.maxSpeed);
const mult = o => P.dmgMin + (P.dmgMax - P.dmgMin) * ratio(o);
const qLeader = () => ({ max: P.maxSpeed, accel: P.accel, brake: P.brake, coast: P.coast, turn: P.turnRate, fx: P.turnSpeedFx });
const qGuard = () => ({ max: P.maxSpeed * 1.15, accel: P.accel * 1.3, brake: P.brake, coast: P.coast, turn: P.turnRate * 1.15, fx: P.turnSpeedFx });
const qCav = () => ({ max: P.maxSpeed * 0.85, accel: P.accel * 0.7, brake: P.brake * 0.6, coast: P.coast, turn: P.turnRate * 0.6, fx: P.turnSpeedFx });

function steer(o, dx, dy, m, dt, q) {
  const mud = mudAt(o.x, o.y), acc = q.accel * (mud ? P.mudMul : 1);
  // 坡度：沿前进方向的坡度，下坡加速、上坡最高速度下降
  const g = gradAt(o.x, o.y), sl = g[0] * Math.cos(o.a) + g[1] * Math.sin(o.a);
  o.slope = sl; o.mud = mud;
  const mx = q.max * (mud ? P.mudMul : 1) * (sl > 0.02 ? 1 - Math.min(0.55, sl * P.slopeK / 500) : 1);
  const om = q.turn * (1 - q.fx * Math.min(1, o.v / q.max));
  let brk = false;
  if (m > 0.1) {
    const d = wrap(Math.atan2(dy, dx) - o.a);
    if (Math.abs(d) > 2.0 && o.v > q.max * 0.25) { o.v = Math.max(0, o.v - q.brake * dt); brk = true; }
    else {
      const tv = Math.min(1, m) * mx;
      if (o.v < tv) o.v = Math.min(tv, o.v + acc * dt);
      else o.v = Math.max(tv, o.v - q.coast * dt);
    }
    const st = om * dt;
    o.a = wrap(o.a + (Math.abs(d) < st ? d : Math.sign(d) * st));
  } else o.v = Math.max(0, o.v - q.coast * dt);
  // 坡度：沿前进方向的坡度，下坡加速、上坡减速
  let cap = mx;
  if (sl < -0.02) { if (o.v > 5) o.v -= P.slopeK * sl * dt; cap = mx * 1.3; }   // 下坡可超速到 130%
  if (o.v > cap) o.v = Math.max(cap, o.v - (mud ? 500 : q.coast * 2) * dt);
  o.x += Math.cos(o.a) * o.v * dt;
  o.y += Math.sin(o.a) * o.v * dt;
  const mg = 30;
  if (o.x < mg || o.x > WORLD - mg || o.y < mg || o.y > WORLD - mg) {
    o.x = clamp(o.x, mg, WORLD - mg); o.y = clamp(o.y, mg, WORLD - mg); o.v *= 0.9;
  }
  return brk;
}

let braking = false;
function dust(o) {
  if (o.mud ? o.v > 30 && Math.random() < 0.5 : o.v > P.maxSpeed * 0.45 && Math.random() < 0.4)
    S.dust.push({ x: o.x - Math.cos(o.a) * 20 + rand(-6, 6), y: o.y - Math.sin(o.a) * 20 + rand(-6, 6), t: 0.5, r: rand(3, 6), mud: o.mud });
}

function updRiders(dt) {
  const L = S.h, inp = getInput();
  braking = steer(L, inp.x || 0, inp.y || 0, inp.m, dt, qLeader());
  dust(L);
  // 亲卫：用同样的惯性跑向楔形阵位
  const ca = Math.cos(L.a), sa = Math.sin(L.a), q = qGuard();
  for (const g of S.g) {
    const sx = L.x + ca * g.ox - sa * g.oy, sy = L.y + sa * g.ox + ca * g.oy;
    const ex = sx - g.x, ey = sy - g.y, d = Math.hypot(ex, ey);
    const along = ex * ca + ey * sa, lat = Math.abs(-ex * sa + ey * ca);
    const fwd = Math.max(L.v, 30) * 0.6;
    let tv = d > 110 ? q.max : clamp(L.v + along * 2 + lat * 0.6, 0, q.max);
    if (L.v < 15 && d < 12) tv = 0;
    steer(g, ca * fwd + ex * 2.5, sa * fwd + ey * 2.5, tv / q.max, dt, q);
    dust(g);
  }
  // 骑手之间互相推开
  const all = [L, ...S.g];
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
    const a = all[i], b = all[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), rr = 30;
    if (d > 0 && d < rr) {
      const p = (rr - d) / 2, nx = dx / d, ny = dy / d;
      if (a.leader) { b.x += nx * p * 2; b.y += ny * p * 2; }
      else { a.x -= nx * p; a.y -= ny * p; b.x += nx * p; b.y += ny * p; }
    }
  }
}

// ===== 敌人 =====
function spawnPos() {
  const z = baseZoom(), dist = Math.hypot(W, H / (P.view25 ? P.squash : 1)) / z / 2 + 60, ang = Math.random() * TAU;
  return [clamp(S.h.x + Math.cos(ang) * dist, 20, WORLD - 20), clamp(S.h.y + Math.sin(ang) * dist, 20, WORLD - 20)];
}
function spawn(type) {
  const [x, y] = spawnPos();
  if (type === 'brute') S.en.push({ type, x, y, r: 20, hp: 220, max: 220, sp: 45, cd: 0, flash: 0 });
  else if (type === 'cav') S.en.push({ type, x, y, r: 13, hp: 70, max: 70, a: Math.atan2(S.h.y - y, S.h.x - x), v: P.maxSpeed * 0.4, cd: 0, flash: 0, commit: 0 });
  else S.en.push({ type: 'grunt', x, y, r: 9, hp: 20, max: 20, sp: rand(55, 75), cd: 0, flash: 0 });
}

function addNum(x, y, txt, col, big) {
  if (S.nums.length > 220) S.nums.shift();
  S.nums.push({ x: x + rand(-6, 6), y: y - 10, txt: String(txt), t: 0.8, col, big });
}

const GRAV = 1400;
function hit(e, dmg, kx, ky, kp) {
  if (e.dead) return;
  e.hp -= dmg; e.flash = 0.1;
  addNum(e.x, e.y, Math.round(dmg), dmg >= 30 ? '#ffb030' : '#fff', dmg >= 30);
  if (e.hp <= 0) {
    e.dead = true; S.kills++;
    e.fly = kp > 450 ? 0.7 : 0.4;
    e.fvx = kx * kp + rand(-80, 80); e.fvy = ky * kp + rand(-80, 80);
    e.spin = rand(-14, 14); e.rot = 0;
    e.z = 0; e.vz = GRAV * e.fly / 2;
  }
}

function hurtRider(rd, dmg, show) {
  if (P.god) return;
  rd.hp -= dmg;
  if (show) { rd.flash = 0.12; addNum(rd.x, rd.y - 14, Math.round(dmg), '#ff5050', false); }
}

const grid = new Map();
const CELL = 40;
function updEnemies(dt) {
  const L = S.h, riders = [L, ...S.g];
  // 刷怪
  S.spawnAcc += (1.5 + S.t * 0.06) * P.spawnMul * dt;
  while (S.spawnAcc >= 1) { S.spawnAcc--; if (S.en.length < 550) spawn('grunt'); }
  S.bruteT -= dt;
  if (S.bruteT <= 0) { S.bruteT = Math.max(6, 20 - S.t * 0.05); if (P.spawnMul > 0) spawn('brute'); }
  if (S.t >= P.cavStart && P.spawnMul > 0) {
    S.cavT -= dt;
    if (S.cavT <= 0) {
      S.cavT = Math.max(4, 12 - (S.t - P.cavStart) * 0.03);
      const n = 1 + Math.floor(Math.random() * Math.min(4, 1 + (S.t - P.cavStart) / 60));
      for (let i = 0; i < n; i++) spawn('cav');
    }
  }

  grid.clear();
  for (const e of S.en) {
    if (e.dead) continue;
    const k = ((e.x / CELL) | 0) * 1000 + ((e.y / CELL) | 0);
    let a = grid.get(k); if (!a) grid.set(k, a = []); a.push(e);
  }
  const qc = qCav();

  for (const e of S.en) {
    if (e.flash > 0) e.flash -= dt;
    if (e.dead) {
      e.fly -= dt; e.x += e.fvx * dt; e.y += e.fvy * dt;
      e.fvx *= 0.94; e.fvy *= 0.94; e.rot += e.spin * dt;
      e.z += e.vz * dt; e.vz -= GRAV * dt; if (e.z < 0) { e.z = 0; e.vz = 0; }
      continue;
    }
    if (e.cd > 0) e.cd -= dt;
    // 最近的骑手
    let tg = L, td = 1e9;
    for (const rd of riders) { const d = Math.hypot(rd.x - e.x, rd.y - e.y); if (d < td) { td = d; tg = rd; } }

    if (e.type === 'cav') {
      // 敌骑：锁定后直线冲锋，冲过头后继续跑一段再回头
      const dx = tg.x - e.x, dy = tg.y - e.y;
      if (e.commit > 0) { e.commit -= dt; steer(e, Math.cos(e.a), Math.sin(e.a), 1, dt, qc); }
      else {
        const facing = (Math.cos(e.a) * dx + Math.sin(e.a) * dy) / (td || 1);
        if (td < 70 && facing < 0.3 && e.v > qc.max * 0.5) e.commit = 0.9;
        steer(e, dx, dy, 1, dt, qc);
      }
      if (e.v > P.maxSpeed * 0.45 && Math.random() < 0.3) S.dust.push({ x: e.x - Math.cos(e.a) * 18, y: e.y - Math.sin(e.a) * 18, t: 0.45, r: rand(3, 5) });
    } else {
      let dx = tg.x - e.x, dy = tg.y - e.y, d = td || 1;
      const esp = e.sp * (mudAt(e.x, e.y) ? 0.6 : 1);
      let mx = dx / d * esp, my = dy / d * esp;
      const cx = (e.x / CELL) | 0, cy = (e.y / CELL) | 0;
      for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
        const a = grid.get((cx + i) * 1000 + cy + j); if (!a) continue;
        for (const o of a) {
          if (o === e) continue;
          const ox = e.x - o.x, oy = e.y - o.y, od = Math.hypot(ox, oy), rr = e.r + o.r;
          if (od > 0 && od < rr) { const p = (rr - od) / rr * 120; mx += ox / od * p; my += oy / od * p; }
        }
      }
      e.x += mx * dt; e.y += my * dt;
    }

    // 与每个骑手碰撞
    for (const rd of riders) {
      if (e.dead) break;
      const fx = Math.cos(rd.a), fy = Math.sin(rd.a);
      const hx = rd.x + fx * 8, hy = rd.y + fy * 8, HR = rd.leader ? 20 : 17;
      let dx = e.x - hx, dy = e.y - hy, d = Math.hypot(dx, dy) || 1;
      const rr = HR + e.r;
      if (d >= rr + 4) continue;
      const nx = dx / d, ny = dy / d, r = ratio(rd), m = mult(rd);
      if (d < rr) {
        if (e.type === 'grunt') {
          if (r >= P.charge) {
            hit(e, P.ramBase * m, fx * 0.7 + nx * 0.6, fy * 0.7 + ny * 0.6, rd.v * 1.3 + 250);
            rd.v *= 0.99;
            if (!e.dead) { e.x = hx + nx * rr; e.y = hy + ny * rr; }
          } else {
            e.x = hx + nx * rr; e.y = hy + ny * rr;
            if (e.cd <= 0) { rd.v = Math.max(0, rd.v - P.maxSpeed * 0.04); e.cd = 0.3; }
          }
        } else if (e.type === 'brute') {
          if (e.cd <= 0) {
            hit(e, P.ramBase * m, nx, ny, 300);
            if (r > 0.3) addNum(rd.x, rd.y - 20, '掉速!', '#7cf', false);
            rd.v *= 0.3; e.cd = 0.6;
          }
          rd.x -= nx * (rr - d); rd.y -= ny * (rr - d);
        } else {
          // 骑兵对撞：比谁朝对方冲得更猛（侧面撞占便宜）
          if (e.cd <= 0) {
            const pR = rd.v * Math.max(0.2, fx * nx + fy * ny);
            const pE = e.v * Math.max(0.2, -(Math.cos(e.a) * nx + Math.sin(e.a) * ny));
            if (pR >= pE) {
              hit(e, P.ramBase * m * 1.5, nx, ny, 220 + rd.v);
              rd.v *= 0.85; e.v *= 0.3;
            } else {
              hurtRider(rd, 10 + 25 * pE / P.maxSpeed, true);
              rd.v *= 0.35; e.v *= 0.7;
              rd.x += Math.cos(e.a) * 14; rd.y += Math.sin(e.a) * 14;
              if (rd.leader && r > 0.2) addNum(rd.x, rd.y - 30, '被撞!', '#ff5050', true);
            }
            e.cd = 0.6;
          }
          const p = (rr - d) / 2;
          e.x += nx * p; e.y += ny * p; rd.x -= nx * p; rd.y -= ny * p;
        }
      }
      // 步兵贴身伤害
      if (!e.dead && e.type !== 'cav') hurtRider(rd, (e.type === 'brute' ? 20 : 5) * dt, false);
    }
  }
  S.en = S.en.filter(e => !e.dead || e.fly > 0);
  // 亲卫阵亡
  S.g = S.g.filter(g => {
    if (g.hp > 0) return true;
    addNum(g.x, g.y - 20, '阵亡', '#ff8080', true);
    return false;
  });
  if (L.hp <= 0) { L.hp = 0; S.dead = true; }
}

// ===== 自动挥砍 =====
const SLASH_R = 75, GSLASH_R = 55;
function slash(rd, R, base, dt) {
  if (rd.slashAnim > 0) rd.slashAnim -= dt;
  if (rd.flash > 0) rd.flash -= dt;
  rd.slashT -= dt;
  if (rd.slashT > 0) return;
  const m = mult(rd);
  let any = false;
  for (const e of S.en) {
    if (e.dead) continue;
    const dx = e.x - rd.x, dy = e.y - rd.y, d = Math.hypot(dx, dy);
    if (d < R + e.r) { any = true; hit(e, base * m, dx / (d || 1), dy / (d || 1), 220); }
  }
  if (any) { rd.slashT = 0.55; rd.slashAnim = 0.18; }
}
function updSlash(dt) {
  slash(S.h, SLASH_R, P.slashBase, dt);
  for (const g of S.g) slash(g, GSLASH_R, P.slashBase * 0.6, dt);
}

// ===== 绘制 =====
function hash(x, y) { let n = x * 374761393 + y * 668265263; n = (n ^ (n >> 13)) * 1274126177; return ((n ^ (n >> 16)) >>> 0) / 4294967296; }

function drawGround(zx, zy) {
  const vw = W / zx, vh = H / zy, x0 = S.cam.x - vw / 2, y0 = S.cam.y - vh / 2;
  ctx.fillStyle = '#2d2a24'; ctx.fillRect(x0, y0, vw, vh);
  ctx.fillStyle = '#6f8f4a'; ctx.fillRect(0, 0, WORLD, WORLD);
  const B = 400;
  for (let i = Math.floor(x0 / B); i <= Math.floor((x0 + vw) / B); i++)
    for (let j = Math.floor(y0 / B); j <= Math.floor((y0 + vh) / B); j++) {
      if (i < 0 || j < 0 || i * B >= WORLD || j * B >= WORLD) continue;
      const hv = hash(i, j);
      if (hv < 0.5) {
        ctx.fillStyle = hv < 0.25 ? 'rgba(60,80,30,.35)' : 'rgba(150,140,80,.25)';
        ctx.beginPath(); ctx.ellipse(i * B + 200 + (hash(i + 7, j) - .5) * 150, j * B + 200 + (hash(i, j + 7) - .5) * 150, 120 + hv * 200, 80 + hash(j, i) * 120, hv * 6, 0, TAU); ctx.fill();
      }
    }
  if (P.terrain) drawTerrain(x0, y0, vw, vh);
  ctx.strokeStyle = 'rgba(0,0,0,.07)'; ctx.lineWidth = 2; ctx.beginPath();
  const G = 160;
  for (let x = Math.max(0, Math.floor(x0 / G) * G); x <= Math.min(WORLD, x0 + vw); x += G) { ctx.moveTo(x, Math.max(0, y0)); ctx.lineTo(x, Math.min(WORLD, y0 + vh)); }
  for (let y = Math.max(0, Math.floor(y0 / G) * G); y <= Math.min(WORLD, y0 + vh); y += G) { ctx.moveTo(Math.max(0, x0), y); ctx.lineTo(Math.min(WORLD, x0 + vw), y); }
  ctx.stroke();
  const C = 70;
  ctx.lineWidth = 2;
  for (let i = Math.floor(x0 / C); i <= Math.floor((x0 + vw) / C); i++)
    for (let j = Math.floor(y0 / C); j <= Math.floor((y0 + vh) / C); j++) {
      if (i < 0 || j < 0 || i * C >= WORLD || j * C >= WORLD) continue;
      const hv = hash(i + 99, j + 31), px = i * C + hash(i, j + 3) * C, py = j * C + hash(i + 5, j) * C;
      if (hv < 0.3) {
        ctx.strokeStyle = '#4f6e30'; ctx.beginPath();
        ctx.moveTo(px - 4, py); ctx.lineTo(px - 6, py - 7); ctx.moveTo(px, py); ctx.lineTo(px, py - 9); ctx.moveTo(px + 4, py); ctx.lineTo(px + 6, py - 7);
        ctx.stroke();
      } else if (hv < 0.36) {
        ctx.fillStyle = '#8c8a7a'; ctx.beginPath(); ctx.ellipse(px, py, 5, 3.5, 0, 0, TAU); ctx.fill();
      } else if (hv < 0.39) {
        ctx.fillStyle = '#d9c96a'; ctx.beginPath(); ctx.arc(px, py, 2.5, 0, TAU); ctx.fill();
      }
    }
  ctx.strokeStyle = '#3b2f1e'; ctx.lineWidth = 12; ctx.strokeRect(0, 0, WORLD, WORLD);
}

function drawTerrain(x0, y0, vw, vh) {
  const vis = (x, y, r) => x + r > x0 && x - r < x0 + vw && y + r > y0 && y - r < y0 + vh;
  for (const h of HILLS) {
    const R = h.r * 1.8;
    if (!vis(h.x, h.y, R)) continue;
    // 背光面（右下）暗、迎光面（左上）亮
    let g = ctx.createRadialGradient(h.x + h.r * 0.35, h.y + h.r * 0.35, 0, h.x + h.r * 0.35, h.y + h.r * 0.35, R);
    g.addColorStop(0, `rgba(30,45,15,${0.2 + h.h / 600})`); g.addColorStop(1, 'rgba(30,45,15,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(h.x + h.r * 0.35, h.y + h.r * 0.35, R, 0, TAU); ctx.fill();
    g = ctx.createRadialGradient(h.x - h.r * 0.25, h.y - h.r * 0.25, 0, h.x - h.r * 0.25, h.y - h.r * 0.25, h.r * 1.3);
    g.addColorStop(0, `rgba(255,250,200,${0.16 + h.h / 600})`); g.addColorStop(1, 'rgba(255,250,200,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(h.x - h.r * 0.25, h.y - h.r * 0.25, h.r * 1.3, 0, TAU); ctx.fill();
    // 等高线
    ctx.strokeStyle = 'rgba(40,50,20,.38)'; ctx.lineWidth = 2.5;
    for (let lv = 30; lv < h.h; lv += 40) {
      const rr = h.r * Math.sqrt(Math.log(h.h / lv));
      ctx.beginPath(); ctx.arc(h.x, h.y, rr, 0, TAU); ctx.stroke();
    }
  }
  for (const m of MUDS) {
    if (!vis(m.x, m.y, m.r * 1.6)) continue;
    ctx.fillStyle = '#4e3a22';
    for (const b of m.blobs) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#6e5432';
    for (const b of m.blobs) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); }
    ctx.fillStyle = 'rgba(150,170,180,.35)';
    for (const b of m.blobs) { ctx.beginPath(); ctx.ellipse(b.x - b.r * 0.3, b.y - b.r * 0.2, b.r * 0.25, b.r * 0.12, 0.3, 0, TAU); ctx.fill(); }
  }
}

// 画一名骑手。st: {horse, rider, ring, s(缩放)}
function drawRider(o, st, charging) {
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.a); ctx.scale(st.s, st.s);
  if (charging) {
    ctx.fillStyle = `rgba(255,140,40,${0.25 + 0.2 * Math.sin(S.t * 30)})`;
    ctx.beginPath(); ctx.moveTo(38, 0); ctx.lineTo(14, -20); ctx.lineTo(14, 20); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(2, 4, 26, 12, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = o.flash > 0 ? '#fff' : st.horse; ctx.strokeStyle = '#3a2e22'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 0, 22, 10, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(23, 0, 9, 6, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#3a2e22'; ctx.fillRect(-26, -2, 6, 4);
  ctx.fillStyle = st.rider; ctx.strokeStyle = st.ring; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(-2, 0, 8, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#ccc'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-6, 6); ctx.lineTo(30, 12); ctx.stroke();
  ctx.restore();
}
function drawSlash(o, R) {
  if (o.slashAnim <= 0) return;
  const k = o.slashAnim / 0.18;
  ctx.strokeStyle = `rgba(255,255,255,${k * 0.8})`; ctx.lineWidth = 5;
  const st = o.a + (1 - k) * TAU;
  ctx.beginPath(); ctx.arc(o.x, o.y, R, st - 1.5, st); ctx.stroke();
}
function hpBar(o, w) {
  if (o.hp >= o.max) return;
  ctx.fillStyle = '#000'; ctx.fillRect(o.x - w / 2, o.y - 26, w, 4);
  ctx.fillStyle = '#4c4'; ctx.fillRect(o.x - w / 2, o.y - 26, w * Math.max(0, o.hp) / o.max, 4);
}

const ST_LEADER = { horse: '#e8e2d6', rider: '#f5f5f5', ring: '#2a5db0', s: 1 };
const ST_GUARD = { horse: '#a07850', rider: '#c8d4e6', ring: '#2a5db0', s: 0.85 };
const ST_CAV = { horse: '#5a3020', rider: '#2a2a2a', ring: '#c03020', s: 0.9 };

function drawEnemies() {
  for (const e of S.en) {
    if (e.type === 'cav') {
      ctx.save();
      if (e.dead) ctx.globalAlpha = Math.max(0, Math.min(1, e.fly * 3));
      if (e.dead) { ctx.translate(e.x, e.y); ctx.rotate(e.rot); ctx.translate(-e.x, -e.y); }
      drawRider(e, ST_CAV, !e.dead && e.v > P.maxSpeed * 0.6);
      ctx.restore();
      if (!e.dead && e.hp < e.max) hpBar(e, 26);
      continue;
    }
    ctx.save(); ctx.translate(e.x, e.y);
    if (e.dead) { ctx.scale(1 + e.z / 120, 1 + e.z / 120); ctx.rotate(e.rot); ctx.globalAlpha = Math.max(0, Math.min(1, e.fly * 3)); }
    ctx.fillStyle = e.flash > 0 ? '#fff' : (e.type === 'brute' ? '#5b3a6e' : '#b8432f');
    ctx.strokeStyle = '#2a1410'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill(); ctx.stroke();
    if (e.type === 'grunt') { ctx.fillStyle = '#e8c34a'; ctx.fillRect(-e.r, -3, e.r * 2, 3); }
    ctx.restore();
    if (e.type === 'brute' && !e.dead) {
      ctx.fillStyle = '#000'; ctx.fillRect(e.x - 20, e.y - 30, 40, 5);
      ctx.fillStyle = '#e44'; ctx.fillRect(e.x - 20, e.y - 30, 40 * e.hp / e.max, 5);
    }
  }
}

function drawDust(dt, three) {
  for (const d of S.dust) {
    d.t -= dt;
    const p = three ? P3(d.x, d.y, (0.5 - d.t) * 20) : [d.x, d.y];
    ctx.fillStyle = d.mud ? `rgba(80,55,30,${Math.max(0, d.t * 1.4)})` : `rgba(200,180,130,${Math.max(0, d.t)})`; ctx.beginPath(); ctx.arc(p[0], p[1], d.r * (1.5 - d.t), 0, TAU); ctx.fill();
  }
  S.dust = S.dust.filter(d => d.t > 0);
}
function drawNums(dt, three) {
  ctx.textAlign = 'center'; ctx.lineWidth = 3;
  for (const n of S.nums) {
    n.t -= dt; n.y -= 40 * dt;
    const p = three ? P3(n.x, n.y, 40) : [n.x, n.y];
    ctx.globalAlpha = clamp(n.t * 2.5, 0, 1);
    ctx.font = `bold ${n.big ? 20 : 14}px system-ui,sans-serif`;
    ctx.strokeStyle = '#000'; ctx.strokeText(n.txt, p[0], p[1]);
    ctx.fillStyle = n.col; ctx.fillText(n.txt, p[0], p[1]);
  }
  ctx.globalAlpha = 1;
  S.nums = S.nums.filter(n => n.t > 0);
}

// ===== 2.5D 绘制 =====
let SQ = 1;
function P3(x, y, h) { return [x - S.cam.x, (y - S.cam.y) * SQ - h]; }
function L3(o, f, sd, h) { const c = Math.cos(o.a), n = Math.sin(o.a); return P3(o.x + c * f - n * sd, o.y + n * f + c * sd, h + (o.z || 0)); }
function seg(a, b, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
function shadow3(x, y, rx, ry, a) {
  const p = P3(x, y, 0);
  ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(1, SQ); ctx.rotate(a || 0);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU); ctx.fill(); ctx.restore();
}
function drawRider3(o, st, charging) {
  const s = st.s, k = (f, sd, h) => L3(o, f * s, sd * s, h * s);
  const ph = S.t * (6 + 14 * ratio(o)) + (o.phase || 0), amp = 5 * Math.min(1, o.v / 60);
  shadow3(o.x, o.y, 24 * s, 10 * s, o.a);
  if (charging) {
    const a = k(42, 0, 0), b = k(16, -18, 0), c = k(16, 18, 0);
    ctx.fillStyle = `rgba(255,140,40,${0.25 + 0.2 * Math.sin(S.t * 30)})`;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.closePath(); ctx.fill();
  }
  ctx.lineCap = 'round';
  const dark = '#3a2e22', hc = o.flash > 0 ? '#fff' : st.horse;
  for (const [f, sd, off] of [[12, -5, 0], [12, 5, Math.PI], [-12, -5, Math.PI / 2], [-12, 5, Math.PI * 1.5]])
    seg(k(f, sd, 13), k(f + Math.sin(ph + off) * amp, sd, Math.max(0, Math.cos(ph + off)) * amp * 0.6), 3 * s, dark);
  const bob = Math.abs(Math.sin(ph)) * amp * 0.4;
  const b0 = k(-17, 0, 17 + bob), b1 = k(15, 0, 19 + bob);
  seg(b0, b1, 17 * s, dark); seg(b0, b1, 14 * s, hc);
  const n0 = k(13, 0, 21 + bob), n1 = k(23, 0, 31 + bob), hd = k(30, 0, 27 + bob);
  seg(n0, n1, 9 * s, dark); seg(n1, hd, 8 * s, dark); seg(n0, n1, 6.5 * s, hc); seg(n1, hd, 5.5 * s, hc);
  seg(k(-18, 0, 18 + bob), k(-25, 0, 8 + bob), 3 * s, dark);
  const t0 = k(-2, 0, 24 + bob), t1 = k(-1, 0, 37 + bob);
  seg(t0, t1, 12 * s, st.ring); seg(t0, t1, 9 * s, st.rider);
  const hp = k(-1, 0, 44 + bob);
  ctx.fillStyle = st.rider; ctx.strokeStyle = st.ring; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(hp[0], hp[1], 5 * s, 0, TAU); ctx.fill(); ctx.stroke();
  seg(k(-6, 7, 30 + bob), k(32, 11, 34 + bob), 2 * s, '#ddd');
  ctx.lineCap = 'butt';
}
function drawFoot3(e) {
  const big = e.type === 'brute', r = e.r, zz = e.z || 0, hgt = big ? 30 : 16;
  const sh = 1 / (1 + zz / 80);
  shadow3(e.x, e.y, r * sh, r * 0.6 * sh, 0);
  const p = P3(e.x, e.y, zz);
  ctx.save(); ctx.translate(p[0], p[1] - hgt / 2);
  if (e.dead) { ctx.rotate(e.rot); ctx.globalAlpha = clamp(e.fly * 3, 0, 1); }
  ctx.translate(0, hgt / 2);
  ctx.lineCap = 'round';
  const col = e.flash > 0 ? '#fff' : (big ? '#5b3a6e' : '#b8432f');
  seg([0, -r * 0.6], [0, -hgt], r * 1.5 + 3, '#2a1410'); seg([0, -r * 0.6], [0, -hgt], r * 1.5, col);
  ctx.fillStyle = '#d9a877'; ctx.strokeStyle = '#2a1410'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, -hgt - r * 0.55, r * 0.6, 0, TAU); ctx.fill(); ctx.stroke();
  if (!big) { ctx.fillStyle = '#e8c34a'; ctx.fillRect(-r * 0.6, -hgt - r * 0.85, r * 1.2, 2.5); }
  ctx.lineCap = 'butt';
  ctx.restore();
}
function bar3(o, w, h, col) {
  const p = P3(o.x, o.y, h);
  ctx.fillStyle = '#000'; ctx.fillRect(p[0] - w / 2, p[1], w, 4);
  ctx.fillStyle = col; ctx.fillRect(p[0] - w / 2, p[1], w * Math.max(0, o.hp) / o.max, 4);
}
function drawSlash3(o, R) {
  if (o.slashAnim <= 0) return;
  const k = o.slashAnim / 0.18, p = P3(o.x, o.y, 0);
  ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(1, SQ);
  ctx.strokeStyle = `rgba(255,255,255,${k * 0.8})`; ctx.lineWidth = 5;
  const st = o.a + (1 - k) * TAU;
  ctx.beginPath(); ctx.arc(0, 0, R, st - 1.5, st); ctx.stroke();
  ctx.restore();
}
function draw3(dt) {
  drawDust(dt, true);
  for (const g of S.g) drawSlash3(g, GSLASH_R);
  drawSlash3(S.h, SLASH_R);
  const list = [...S.en, ...S.g, S.h].sort((a, b) => a.y - b.y);
  for (const o of list) {
    if (o === S.h) drawRider3(o, ST_LEADER, ratio(o) >= P.charge);
    else if (!o.type) { drawRider3(o, ST_GUARD, ratio(o) >= P.charge); if (o.hp < o.max) bar3(o, 26, 52, '#4c4'); }
    else if (o.type === 'cav') {
      ctx.save(); if (o.dead) ctx.globalAlpha = clamp(o.fly * 3, 0, 1);
      drawRider3(o, ST_CAV, !o.dead && o.v > P.maxSpeed * 0.6); ctx.restore();
      if (!o.dead && o.hp < o.max) bar3(o, 26, 50, '#e44');
    } else { drawFoot3(o); if (o.type === 'brute' && !o.dead) bar3(o, 40, 56, '#e44'); }
  }
  drawNums(dt, true);
}

function drawHUD() {
  const L = S.h, r = ratio(L), m = mult(L);
  const bw = Math.min(420, W * 0.6), bx = (W - bw) / 2, by = H - 30, bh = 14;
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(bx - 3, by - 3, bw + 6, bh + 6);
  ctx.fillStyle = r > 1.01 ? '#ff3a3a' : r >= P.charge ? '#ff7a2a' : (r > 0.4 ? '#f2c94c' : '#9aa'); ctx.fillRect(bx, by, bw * Math.min(1, r), bh);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx + bw * P.charge, by - 3); ctx.lineTo(bx + bw * P.charge, by + bh + 3); ctx.stroke();
  ctx.font = 'bold 14px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = '#000';
  const label = `速度 ${Math.round(r * 100)}%   伤害 ×${m.toFixed(2)}${r >= P.charge ? '   冲锋！' : ''}${braking ? '   刹车' : ''}${L.slope < -0.02 ? '   下坡↓' : L.slope > 0.02 ? '   上坡↑' : ''}${L.mud ? '   泥地' : ''}`;
  ctx.strokeText(label, W / 2, by - 8); ctx.fillStyle = '#fff'; ctx.fillText(label, W / 2, by - 8);
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(10, 10, 154, 12);
  ctx.fillStyle = P.god ? '#6cf' : '#e33'; ctx.fillRect(12, 12, 150 * L.hp / L.max, 8);
  const mm = Math.floor(S.t / 60), ss = Math.floor(S.t % 60);
  const info = `${mm}:${String(ss).padStart(2, '0')}   击杀 ${S.kills}   亲卫 ${S.g.length}   敌人 ${S.en.length}`;
  ctx.font = 'bold 13px system-ui,sans-serif';
  ctx.strokeText(info, 10, 40); ctx.fillStyle = '#fff'; ctx.fillText(info, 10, 40);
  if (S.t >= P.cavStart && S.t < P.cavStart + 3) { ctx.fillStyle = '#ff6040'; ctx.strokeText('敌军骑兵来袭！', 10, 60); ctx.fillText('敌军骑兵来袭！', 10, 60); }
  else if (H > W) { ctx.fillStyle = '#ffd'; ctx.fillText('建议横屏', 10, 60); }
  if (joy.on) {
    const dx = joy.x - joy.bx, dy = joy.y - joy.by, d = Math.hypot(dx, dy), k = d > joy.R ? joy.R / d : 1;
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, joy.R, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(joy.bx + dx * k, joy.by + dy * k, 24, 0, TAU); ctx.fill();
  }
  if (S.dead) {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px system-ui,sans-serif'; ctx.fillText('力竭落马', W / 2, H / 2 - 20);
    ctx.font = '16px system-ui,sans-serif';
    ctx.fillText(`存活 ${mm}:${String(ss).padStart(2, '0')}   击杀 ${S.kills}`, W / 2, H / 2 + 14);
    ctx.fillText('点击屏幕 / 按空格 重新开始', W / 2, H / 2 + 42);
  }
}

// ===== 主循环 =====
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!S.dead) { S.t += dt; updRiders(dt); updEnemies(dt); updSlash(dt); }
  const h = S.h, z = baseZoom();
  const look = 0.35 * h.v;
  const tx = h.x + Math.cos(h.a) * look, ty = h.y + Math.sin(h.a) * look;
  const k = 1 - Math.exp(-5 * dt);
  S.cam.x += (tx - S.cam.x) * k; S.cam.y += (ty - S.cam.y) * k;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const fdt = S.dead ? 0 : dt;
  if (P.view25) {
    SQ = P.squash;
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z * SQ); ctx.translate(-S.cam.x, -S.cam.y);
    drawGround(z, z * SQ); ctx.restore();
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z);
    draw3(fdt);
    ctx.restore();
  } else {
    ctx.save();
    ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-S.cam.x, -S.cam.y);
    drawGround(z, z);
    drawDust(fdt, false);
    drawEnemies();
    for (const g of S.g) { drawRider(g, ST_GUARD, ratio(g) >= P.charge); hpBar(g, 26); drawSlash(g, GSLASH_R); }
    drawRider(h, ST_LEADER, ratio(h) >= P.charge); drawSlash(h, SLASH_R);
    drawNums(fdt, false);
    ctx.restore();
  }
  drawHUD();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ===== 调试面板 =====
if (DEBUG) {
  const box = document.getElementById('dbg'), bd = document.getElementById('dbgBd');
  box.style.display = 'block';
  for (const [key, name, min, max, step] of SLIDERS) {
    const l = document.createElement('label');
    l.innerHTML = `<div class="t"><span>${name}</span><span id="v_${key}">${P[key]}</span></div><input type="range" min="${min}" max="${max}" step="${step}" value="${P[key]}">`;
    l.querySelector('input').addEventListener('input', ev => {
      P[key] = +ev.target.value; document.getElementById('v_' + key).textContent = P[key];
      if (key === 'guards') setGuards(P.guards);
    });
    bd.appendChild(l);
  }
  const v = document.createElement('label');
  v.innerHTML = '<input type="checkbox" checked> 2.5D 视角（关掉 = 正俯视）';
  v.querySelector('input').addEventListener('change', ev => { P.view25 = ev.target.checked; });
  bd.appendChild(v);
  const tr = document.createElement('label');
  tr.innerHTML = '<input type="checkbox" checked> 地形（坡地/泥地）';
  tr.querySelector('input').addEventListener('change', ev => { P.terrain = ev.target.checked; });
  bd.appendChild(tr);
  const g = document.createElement('label');
  g.innerHTML = '<input type="checkbox"> 无敌';
  g.querySelector('input').addEventListener('change', ev => { P.god = ev.target.checked; });
  bd.appendChild(g);
  const b = document.createElement('button'); b.textContent = '重新开始'; b.onclick = reset; bd.appendChild(b);
  const c = document.createElement('button'); c.textContent = '复制当前参数';
  c.onclick = () => {
    const t = JSON.stringify(P);
    const done = () => c.textContent = '已复制';
    const fail = () => { c.textContent = '复制失败，见下方'; let ta = bd.querySelector('textarea'); if (!ta) { ta = document.createElement('textarea'); ta.style.width = '100%'; bd.appendChild(ta); } ta.value = t; ta.select(); };
    try { navigator.clipboard.writeText(t).then(done, fail); } catch (e) { fail(); }
  };
  bd.appendChild(c);
  let open = innerWidth > 1000;
  const setOpen = () => { bd.style.display = open ? 'block' : 'none'; document.getElementById('dbgArrow').textContent = open ? '▲' : '▼'; };
  document.getElementById('dbgHd').onclick = () => { open = !open; setOpen(); };
  setOpen();
}
</script>
